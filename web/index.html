<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FlyConnect — the social network for aviation crew. Connect with colleagues, find layover buddies, and discover crew-only deals.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FlyConnect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FlyConnect</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Google Maps JavaScript API — required by google_maps_flutter_web for the
       admin "Nearby" map. Recommend a separate HTTP-referrer-restricted web key;
       the committed mobile key may be application-restricted and rejected on web. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDHWqqTekBAR3R9x9rNWQ8CHAIhqZjX3Hk"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
